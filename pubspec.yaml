name: remindly
description: "Remindly – Smart Life Reminder"
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Ads
  google_mobile_ads: ^5.3.0

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  cupertino_icons: ^1.0.8
  table_calendar: ^3.1.2

  # Utils
  uuid: ^4.5.1
  intl: any
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png.jpeg"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  generate: true
